name: Preview or reset AI run only

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Preview is read-only. Execute archives and resets only the AI run.'
        type: choice
        options: [preview, execute]
        default: preview
      run_id:
        description: 'Immutable identifier for the new AI run.'
        required: true
        default: ai-v6-2026-10-28
      expected_commit:
        description: 'Full verified deployed commit SHA.'
        required: true
      confirm:
        description: 'Execute requires AI_ONLY_RESET. Human state and old histories are preserved.'
        default: ''

permissions:
  contents: read

concurrency:
  group: quant-vps
  cancel-in-progress: false

jobs:
  reset-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate operation before using the Oracle connection
        id: operation
        env:
          MODE: ${{ inputs.mode }}
          RUN_ID: ${{ inputs.run_id }}
          EXPECTED: ${{ inputs.expected_commit }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -eu
          [[ "$MODE" == preview || "$MODE" == execute ]]
          [[ "$RUN_ID" =~ ^[A-Za-z0-9][A-Za-z0-9_-]{0,79}$ ]]
          [[ "$EXPECTED" =~ ^[a-f0-9]{40}$ ]]
          if [ "$MODE" = execute ]; then [ "$CONFIRM" = AI_ONLY_RESET ]; fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "expected=$EXPECTED" >> "$GITHUB_OUTPUT"
      - name: Archive-first AI-only operation on the verified release
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          command_timeout: 8m
          script: |
            set -eu
            umask 077
            cd /home/ubuntu/version-6
            EXPECTED='${{ steps.operation.outputs.expected }}'
            RUN_ID='${{ steps.operation.outputs.run_id }}'
            MODE='${{ steps.operation.outputs.mode }}'
            test "$(git rev-parse HEAD)" = "$EXPECTED"
            test "$(docker inspect quant-swing-daemon --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$EXPECTED"
            IMAGE="quant-trader:$EXPECTED"
            RESULT_FILE="$(mktemp)"
            trap 'rm -f "$RESULT_FILE"' EXIT
            if [ "$MODE" = execute ]; then
              docker run --rm --network container:quant-redis -v "$PWD/data:/app/data" "$IMAGE" \
                tsx scripts/reset-ai-run.ts --run-id "$RUN_ID" --archive-dir /app/data/ai-run-archives --execute > "$RESULT_FILE"
            else
              docker run --rm --network container:quant-redis -v "$PWD/data:/app/data" "$IMAGE" \
                tsx scripts/reset-ai-run.ts --run-id "$RUN_ID" --archive-dir /app/data/ai-run-archives > "$RESULT_FILE"
            fi
            node - "$RESULT_FILE" "$MODE" "$RUN_ID" <<'NODE'
            const fs=require('fs');
            const [file,mode,runId]=process.argv.slice(2);
            const rows=fs.readFileSync(file,'utf8').trim().split(/\r?\n/).filter(Boolean).map(line=>JSON.parse(line));
            const preview=rows[0];
            if(!preview || preview.mode!==(mode==='execute'?'EXECUTE':'PREVIEW') || preview.runId!==runId ||
              preview.capital!==10000 || typeof preview.canReset!=='boolean' || !Array.isArray(preview.blockers) ||
              !/^[a-f0-9]{64}$/.test(preview.humanDigest??'') || !/^[a-f0-9]{64}$/.test(preview.sourceDigest??'')) throw Error('Missing or invalid reset preview receipt');
            console.log(JSON.stringify({mode:preview.mode,runId,canReset:preview.canReset,capital:preview.capital,
              blockers:preview.blockers,humanDigest:preview.humanDigest,sourceDigest:preview.sourceDigest,
              coveredSourceKeys:preview.coverage?.archivedKeys?.length,oldAiCash:preview.oldAiCash,oldXsecCash:preview.oldXsecCash}));
            if(mode==='preview' && rows.length!==1) throw Error('Unexpected preview output');
            if(mode==='execute'){
              const done=rows[1],run=done?.run;
              if(!preview.canReset || preview.blockers.length || rows.length!==2 || done.mode!=='COMPLETED' ||
                run?.runId!==runId || run.capital!==10000 || run.initialCapital!==10000 ||
                run.mode!=='SHADOW' || run.xsecMode!=='HISTORICAL_ONLY' ||
                !/^[a-f0-9]{64}$/.test(run.archive?.sha256??'')) throw Error('Missing or invalid completed reset receipt');
              console.log(JSON.stringify(done));
            }
            NODE
