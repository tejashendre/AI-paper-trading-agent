name: VPS Maintenance

# Manual only. Two operations that need shell access on the box but should not
# need a human at a terminal: reclaiming Docker disk, and restoring a portfolio
# from one of the snapshots the deploy and reset workflows leave behind.
on:
  workflow_dispatch:
    inputs:
      prune_docker:
        description: 'Reclaim Docker build cache, unused images and stopped containers.'
        type: boolean
        required: false
        default: true
      restore_human_portfolio:
        description: 'Restore the human portfolio and trade history from the newest snapshot that still has it.'
        type: boolean
        required: false
        default: false
      cache_age:
        description: "Build-cache age to prune. '24h' keeps recent layers; 'all' reclaims everything unused."
        required: false
        default: '24h'
      dry_run:
        description: 'Report only. Nothing is pruned or restored.'
        type: boolean
        required: false
        default: true

jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      - name: Run maintenance on Oracle VPS
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          command_timeout: 25m
          script: |
            set -eu
            cd /home/ubuntu/version-6
            DRY="${{ inputs.dry_run }}"

            echo "=================== DISK BEFORE ==================="
            df -h . | tail -1
            docker system df

            if [ "${{ inputs.restore_human_portfolio }}" = "true" ]; then
              echo ""
              echo "=================== PORTFOLIO RESTORE ==================="
              WORK="$(mktemp -d)"
              SNAP=""

              # Search newest-first for a snapshot that actually holds history.
              # Taking simply the newest is wrong: a reset run snapshots before
              # its own reset, so a second reset moments later captures a state
              # that an earlier run had already wiped.
              echo "--- snapshots available on the box ---"
              ls -1dt data/reset-backups/*/ 2>/dev/null || echo "  (no reset-backups)"
              ls -1dt data/deploy-backups/*/ 2>/dev/null | head -10 || echo "  (no deploy-backups)"
              echo ""
              echo "--- scanning snapshots for a human portfolio with trades ---"
              for CAND in $(ls -1dt data/reset-backups/*/ data/deploy-backups/*/ 2>/dev/null); do
                if [ ! -f "${CAND}redis-dump.rdb" ]; then continue; fi
                WORK="$(mktemp -d)"
                cp "${CAND}redis-dump.rdb" "$WORK/dump.rdb"
                chmod 644 "$WORK/dump.rdb"
                docker rm -f snapshot-redis >/dev/null 2>&1 || true
                docker run --rm -d --name snapshot-redis --user "$(id -u):$(id -g)" -v "$WORK":/data redis:7-alpine redis-server --dbfilename dump.rdb --dir /data >/dev/null
                sleep 3
                CAND_TRADES="$(docker exec snapshot-redis redis-cli LLEN user:trades 2>/dev/null || echo 0)"
                CAND_USD="$(docker exec snapshot-redis redis-cli GET user:portfolio 2>/dev/null | grep -o '"usd":[0-9.]*' | head -1 || true)"
                echo "  ${CAND} trades=${CAND_TRADES} ${CAND_USD:-}"
                docker rm -f snapshot-redis >/dev/null 2>&1 || true
                if [ "${CAND_TRADES:-0}" -gt 0 ]; then
                  SNAP="$CAND"
                  break
                fi
              done

              if [ -z "$SNAP" ]; then
                echo ""
                echo "No snapshot contained a human portfolio with trade history."
                echo "The live portfolio is left untouched."
                rm -rf "$WORK"
              else
                echo ""
                echo "Using snapshot: $SNAP"
                WORK="$(mktemp -d)"
                cp "${SNAP}redis-dump.rdb" "$WORK/dump.rdb"
                chmod 644 "$WORK/dump.rdb"
                docker rm -f snapshot-redis >/dev/null 2>&1 || true
                docker run --rm -d --name snapshot-redis --user "$(id -u):$(id -g)" -v "$WORK":/data redis:7-alpine redis-server --dbfilename dump.rdb --dir /data >/dev/null
                sleep 4

                echo "--- snapshot contents ---"
                docker exec snapshot-redis redis-cli GET user:portfolio | head -c 400 || true
                echo ""
                TRADE_COUNT="$(docker exec snapshot-redis redis-cli LLEN user:trades || echo 0)"
                echo "human trade history entries: $TRADE_COUNT"

                if [ "$DRY" = "true" ]; then
                  echo "Dry run: the values above would be written to the live Redis."
                else
                  # redis-cli -x reads the value from stdin, so JSON braces and
                  # quotes are never re-parsed by the shell.
                  docker exec snapshot-redis redis-cli GET user:portfolio > "$WORK/user_portfolio.json"
                  if [ -s "$WORK/user_portfolio.json" ]; then
                    docker exec -i quant-redis redis-cli -x SET user:portfolio < "$WORK/user_portfolio.json"
                    echo "user:portfolio restored."
                  fi

                  if [ "$TRADE_COUNT" -gt 0 ]; then
                    # Rebuild oldest-first so LPUSH leaves the newest at the
                    # head, which is the order the dashboard reads.
                    docker exec quant-redis redis-cli DEL user:trades >/dev/null
                    docker exec snapshot-redis redis-cli LRANGE user:trades 0 -1 > "$WORK/trades.txt"
                    tac "$WORK/trades.txt" | while IFS= read -r line; do
                      if [ -n "$line" ]; then
                        printf '%s' "$line" | docker exec -i quant-redis redis-cli -x LPUSH user:trades >/dev/null
                      fi
                    done
                    echo "user:trades restored: $(docker exec quant-redis redis-cli LLEN user:trades) entries."
                  fi
                  echo "--- live value now ---"
                  docker exec quant-redis redis-cli GET user:portfolio | head -c 300 || true
                  echo ""
                fi

                docker rm -f snapshot-redis >/dev/null 2>&1 || true
                rm -rf "$WORK"
              fi
            fi

            if [ "${{ inputs.prune_docker }}" = "true" ]; then
              echo ""
              echo "=================== DOCKER PRUNE ==================="
              # Never prunes volumes, so redis_data and ./data are untouched.
              export PRUNE_UNTIL="${{ inputs.cache_age }}"
              if [ "$DRY" = "true" ]; then
                sh scripts/vps-maintenance.sh --dry-run
              else
                sh scripts/vps-maintenance.sh --apply
              fi
            fi

            echo ""
            echo "=================== DISK AFTER ==================="
            df -h . | tail -1
            docker system df
            docker compose ps
