name: CI/CD Deploy to VPS

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: quant-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Run Lint
        run: npm run lint

      - name: Build Dashboard
        run: npm run build

      - name: Run Type Check
        run: npx tsc --noEmit

      # Offline: fake Bybit behind fetch, in-memory Redis, temp ledger. No secrets.
      - name: Run Bybit Upgrade Tests
        run: npm run test:upgrade

      - name: Run Strategy Audit
        run: npm run audit:strategy

      - name: Verify Empty or Local Execution Ledger
        run: npm run ledger:verify

      - name: Build Runtime Source Manifest
        run: npm run source:manifest

      - name: Read-only VPS and live-market release preflight
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          command_timeout: 10m
          script: |
            set -eu
            cd /home/ubuntu/version-6
            RELEASE_SHA='${{ github.event.pull_request.head.sha }}'
            git fetch origin "$RELEASE_SHA"
            PREFLIGHT_SCRIPT="data/release-preflight-${RELEASE_SHA}.sh"
            mkdir -p data
            git show "$RELEASE_SHA:scripts/release-preflight.sh" > "$PREFLIGHT_SCRIPT"
            RELEASE_SHA="$RELEASE_SHA" sh "$PREFLIGHT_SCRIPT"

      - name: Deploy to Oracle VPS via SSH
        if: github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          command_timeout: 15m
          script: |
            set -eu
            DEPLOY_COMMIT="${{ github.sha }}"
            DEPLOYED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            BACKUP_STAMP="$(date -u +%Y-%m-%dT%H-%M-%SZ)"
            cd /home/ubuntu/version-6

            echo "Creating a state-preserving pre-deploy snapshot..."
            BACKUP_DIR="data/deploy-backups/${BACKUP_STAMP}-${DEPLOY_COMMIT}"
            mkdir -p "$BACKUP_DIR"
            git rev-parse HEAD > "$BACKUP_DIR/previous-commit.txt"
            git status --short > "$BACKUP_DIR/previous-status.txt"
            git diff --binary > "$BACKUP_DIR/previous-worktree.patch"
            tar -czf "$BACKUP_DIR/previous-runtime-tree.tar.gz" src scripts public package.json package-lock.json docker-compose.yml Dockerfile
            if docker inspect quant-redis >/dev/null 2>&1; then
              docker exec quant-redis redis-cli SAVE
              docker cp quant-redis:/data/dump.rdb "$BACKUP_DIR/redis-dump.rdb"
            fi

            # New code starts with entries frozen; exits keep managing old positions.
            docker exec quant-redis redis-cli SET swing:entryFreeze '{"reason":"Reviewed bot upgrade rollout","setBy":"Codex"}'

            echo "Materializing the exact GitHub commit..."
            git fetch --prune origin main
            git reset --hard "$DEPLOY_COMMIT"
            git clean -fd
            test "$(git rev-parse HEAD)" = "$DEPLOY_COMMIT"

            echo "Rebuilding and starting application containers..."
            export APP_COMMIT_SHA="$DEPLOY_COMMIT"
            export APP_DEPLOYED_AT="$DEPLOYED_AT"
            docker compose build --pull quant-dashboard

            # Owner-approved storage option 1: re-seal the ledger without old
            # per-minute scan records while no daemon is appending. It skips
            # itself when under 50 MB would be reclaimed. Stop every writer
            # and fail the release if compaction or verification refuses.
            echo "Compacting the execution ledger with the writers stopped..."
            if ! sh scripts/release-ledger-maintenance.sh "$BACKUP_DIR"; then
              # The previous containers still exist; bring them back so exits
              # keep running (new entries stay frozen), then fail the release.
              echo "Ledger maintenance refused; restarting the previous release and failing this deploy."
              docker compose start quant-dashboard swing-daemon xsec-daemon || true
              exit 1
            fi

            docker compose up -d --no-build --remove-orphans

            echo "Cross-sectional daemon status (reported, not gated):"
            docker compose ps xsec-daemon || true
            docker logs quant-xsec-daemon --tail=20 2>&1 || true

            echo "Verifying deployment health and scan advancement..."
            STATUS_URL=https://trader.tejashendre.com/api/user/status \
            STATUS_AUTH_TOKEN=SPECTATOR \
            WAIT_SECONDS=75 \
            sh scripts/vps-deploy-check.sh --expected-commit "$(git rev-parse --short HEAD)"

            echo "Lifting the new-entry freeze after health and scan verification..."
            docker exec quant-redis redis-cli DEL swing:entryFreeze

            echo "Compressing historical ledger and reclaiming unused build artifacts..."
            PRUNE_UNTIL=all sh scripts/vps-maintenance.sh --apply

            echo "Deployment completed successfully at $DEPLOY_COMMIT"
