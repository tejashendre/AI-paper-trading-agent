name: CI/CD Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Install Dependencies
        run: npm ci

      - name: Run Lint
        run: npm run lint

      - name: Build Dashboard
        run: npm run build

      - name: Run Type Check
        run: npx tsc --noEmit

      - name: Run Strategy Audit
        run: npm run audit:strategy

      - name: Deploy to Oracle VPS via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -eu
            echo "🚀 Starting Deployment..."
            cd /home/ubuntu/version-6
            
            echo "📥 Pulling latest changes from GitHub..."
            git pull origin main
            
            echo "🐳 Rebuilding and starting Docker containers..."
            docker compose up -d --build --remove-orphans
            
            echo "🧹 Cleaning unused Docker build cache older than seven days..."
            docker builder prune -f --filter "until=168h"

            echo "Verifying deployment health and scan advancement..."
            STATUS_URL=https://trader.tejashendre.com/api/user/status \
            STATUS_AUTH_TOKEN=SPECTATOR \
            WAIT_SECONDS=75 \
            sh scripts/vps-deploy-check.sh --expected-commit "$(git rev-parse --short HEAD)"
            
            echo "✅ Deployment completed successfully!"
